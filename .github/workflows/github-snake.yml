name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/github-snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: himanshusingh412
          outputs: |
            dist/github-snake.svg?color_snake=#e11d74&color_dots=#f3ecfc,#e9d5ff,#c084fc,#a855f7,#7c3aed
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff4d9d&color_dots=#2a1548,#4c2889,#7c3aed,#a855f7,#ff77c2

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
