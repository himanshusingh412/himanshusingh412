<svg width="495" height="195" viewBox="0 0 495 195" xmlns="http://www.w3.org/2000/svg">
  <title>Himanshu's GitHub Stats</title>
  <defs>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d9d"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <style><![CDATA[
      text{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
      .mono{font-family:'SF Mono',Consolas,'Courier New',monospace}
      .row{opacity:0;transform:translateX(-18px);animation:slide 0.6s ease-out forwards}
      @keyframes slide{to{opacity:1;transform:translateX(0)}}
      .ring{stroke-dasharray:0 314;animation:fill 1.6s ease-out 0.5s forwards}
      @keyframes fill{to{stroke-dasharray:264 314}}
      .rankpop{opacity:0;transform:scale(0.4);transform-box:fill-box;transform-origin:center;
        animation:rpop 0.5s cubic-bezier(0.2,1.5,0.4,1) 1.6s forwards}
      @keyframes rpop{to{opacity:1;transform:scale(1)}}
    ]]></style>
  </defs>
  <rect x="1" y="1" width="493" height="193" rx="14" fill="#12081f" stroke="#3d2461" stroke-width="2"/>
  <text x="24" y="38" font-size="19" font-weight="700" fill="#ff77c2">⚡ Himanshu's GitHub Stats</text>
  <g font-size="15">
    <g class="row" style="animation-delay:0.3s">
      <text x="26" y="74" fill="#e8dcff">📦 Public Repos</text><text x="330" y="74" text-anchor="end" font-weight="700" fill="#ff77c2">7</text>
    </g>
    <g class="row" style="animation-delay:0.55s">
      <text x="26" y="104" fill="#e8dcff">🔥 Top Stack</text><text x="330" y="104" text-anchor="end" font-weight="700" fill="#c084fc">TS · JS · HTML</text>
    </g>
    <g class="row" style="animation-delay:0.8s">
      <text x="26" y="134" fill="#e8dcff">🚀 Now Building</text><text x="330" y="134" text-anchor="end" font-weight="700" fill="#22d3ee">Blood-Bridge</text>
    </g>
    <g class="row" style="animation-delay:1.05s">
      <text x="26" y="164" fill="#e8dcff">🤖 Superpower</text><text x="330" y="164" text-anchor="end" font-weight="700" fill="#4ade80">AI Agents + MCP</text>
    </g>
  </g>
  <circle cx="415" cy="112" r="50" fill="none" stroke="#2a1548" stroke-width="9"/>
  <circle class="ring" cx="415" cy="112" r="50" fill="none" stroke="url(#ringGrad)" stroke-width="9" stroke-linecap="round" transform="rotate(-90 415 112)"/>
  <text class="rankpop" x="415" y="122" text-anchor="middle" font-size="34" font-weight="800" fill="#ff77c2">S</text>
  <text x="415" y="146" text-anchor="middle" class="mono" font-size="10" fill="#9d8bc0">RANK</text>
</svg>
