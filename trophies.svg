<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg">
  <title>Trophies</title>
  <defs>
    <linearGradient id="tshine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="trFrame"><rect x="0" y="0" width="900" height="150" rx="14"/></clipPath>
    <style><![CDATA[
      text{font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif}
      .cell{opacity:0;transform:scale(0.5);transform-box:fill-box;transform-origin:center;
        animation:cpop 0.55s cubic-bezier(0.2,1.5,0.4,1) forwards}
      @keyframes cpop{to{opacity:1;transform:scale(1)}}
      .rk{animation:glowp 2.5s ease-in-out infinite}
      @keyframes glowp{0%,100%{opacity:1}50%{opacity:0.55}}
    ]]></style>
  </defs>
  <g clip-path="url(#trFrame)">
  <rect width="900" height="150" rx="14" fill="#12081f" stroke="#3d2461" stroke-width="2"/>
  <g text-anchor="middle">
    <g class="cell" style="animation-delay:0.2s">
      <rect x="14" y="14" width="132" height="122" rx="12" fill="#1d0e35" stroke="#fbbf24" stroke-opacity="0.5"/>
      <text x="80" y="62" font-size="34">🏆</text>
      <text x="80" y="92" font-size="13" font-weight="700" fill="#e8dcff">First Repo</text>
      <text class="rk" x="80" y="118" font-size="15" font-weight="800" fill="#fbbf24">GOLD</text>
    </g>
    <g class="cell" style="animation-delay:0.4s">
      <rect x="161" y="14" width="132" height="122" rx="12" fill="#1d0e35" stroke="#ff4d9d" stroke-opacity="0.5"/>
      <text x="227" y="62" font-size="34">🚀</text>
      <text x="227" y="92" font-size="13" font-weight="700" fill="#e8dcff">7 Projects</text>
      <text class="rk" x="227" y="118" font-size="15" font-weight="800" fill="#ff77c2">A+</text>
    </g>
    <g class="cell" style="animation-delay:0.6s">
      <rect x="308" y="14" width="132" height="122" rx="12" fill="#1d0e35" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="374" y="62" font-size="34">🌐</text>
      <text x="374" y="92" font-size="13" font-weight="700" fill="#e8dcff">Web Builder</text>
      <text class="rk" x="374" y="118" font-size="15" font-weight="800" fill="#22d3ee">A+</text>
    </g>
    <g class="cell" style="animation-delay:0.8s">
      <rect x="455" y="14" width="132" height="122" rx="12" fill="#1d0e35" stroke="#a855f7" stroke-opacity="0.5"/>
      <text x="521" y="62" font-size="34">🤖</text>
      <text x="521" y="92" font-size="13" font-weight="700" fill="#e8dcff">AI Builder</text>
      <text class="rk" x="521" y="118" font-size="15" font-weight="800" fill="#c084fc">S</text>
    </g>
    <g class="cell" style="animation-delay:1.0s">
      <rect x="602" y="14" width="132" height="122" rx="12" fill="#1d0e35" stroke="#4ade80" stroke-opacity="0.5"/>
      <text x="668" y="62" font-size="34">🐍</text>
      <text x="668" y="92" font-size="13" font-weight="700" fill="#e8dcff">Snake Charmer</text>
      <text class="rk" x="668" y="118" font-size="15" font-weight="800" fill="#4ade80">S</text>
    </g>
    <g class="cell" style="animation-delay:1.2s">
      <rect x="749" y="14" width="132" height="122" rx="12" fill="#1d0e35" stroke="#fb923c" stroke-opacity="0.5"/>
      <text x="815" y="62" font-size="34">⚡</text>
      <text x="815" y="92" font-size="13" font-weight="700" fill="#e8dcff">Fast Learner</text>
      <text class="rk" x="815" y="118" font-size="15" font-weight="800" fill="#fb923c">SS</text>
    </g>
  </g>
  <rect x="-120" y="0" width="100" height="150" fill="url(#tshine)" transform="skewX(-15)">
    <animate attributeName="x" values="-120;1020" dur="4s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
  </g>
</svg>
